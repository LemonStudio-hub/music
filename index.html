<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Music Blocks</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    background: #0a0a0a;
    color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    overflow: hidden;
    height: 100vh;
    height: 100dvh;
    user-select: none;
    touch-action: manipulation;
    -webkit-touch-callout: none;
  }

  #start-screen {
    position: fixed; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    z-index: 100;
    background: #0a0a0a;
  }
  #start-screen h1 {
    font-size: 2rem; font-weight: 300;
    letter-spacing: 0.3em; margin-bottom: 2rem;
    color: #fff;
  }
  #drop-zone {
    width: 300px; height: 180px;
    border: 2px dashed #333;
    border-radius: 16px;
    display: flex; align-items: center; justify-content: center;
    flex-direction: column; gap: 0.5rem;
    cursor: pointer; transition: all 0.3s;
    position: relative;
  }
  #drop-zone:hover, #drop-zone.dragover {
    border-color: #555; background: #111;
  }
  #drop-zone svg { width: 40px; height: 40px; fill: #555; }
  #drop-zone span { color: #555; font-size: 0.85rem; }
  #file-input { display: none; }
  #file-name {
    margin-top: 1rem; color: #444; font-size: 0.8rem;
    max-width: 300px; text-align: center;
  }

  #game {
    position: fixed; inset: 0; display: none;
  }
  canvas { display: block; width: 100%; height: 100%; }

  #score {
    position: fixed; top: 20px; left: 50%;
    transform: translateX(-50%);
    font-size: 1.5rem; font-weight: 200;
    letter-spacing: 0.2em; color: #fff;
    z-index: 10; pointer-events: none;
    text-shadow: 0 0 20px rgba(255,255,255,0.3);
  }
  #combo {
    position: fixed; top: 55px; left: 50%;
    transform: translateX(-50%);
    font-size: 0.85rem; font-weight: 300;
    color: #666; z-index: 10;
    pointer-events: none; letter-spacing: 0.15em;
  }

  #progress-bar {
    position: fixed; bottom: 0; left: 0;
    height: 3px; background: #fff;
    opacity: 0.3; z-index: 10;
    transition: width 0.3s linear;
  }

  .hit-effect {
    position: fixed; pointer-events: none; z-index: 20;
    font-size: 1.2rem; font-weight: 300;
    animation: hitUp 0.6s ease-out forwards;
  }
  @keyframes hitUp {
    0% { opacity: 1; transform: translateY(0); }
    100% { opacity: 0; transform: translateY(-60px); }
  }

  #pause-overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.8);
    display: none; align-items: center;
    justify-content: center; z-index: 50;
    flex-direction: column; gap: 1rem;
  }
  #pause-overlay.show { display: flex; }
  #pause-overlay p { font-size: 1.2rem; font-weight: 200; letter-spacing: 0.2em; color: #666; }
  #pause-overlay button {
    background: none; border: 1px solid #333;
    color: #888; padding: 8px 24px; border-radius: 8px;
    cursor: pointer; font-size: 0.85rem; letter-spacing: 0.1em;
    transition: all 0.2s;
  }
  #pause-overlay button:hover { border-color: #666; color: #fff; }

  /* Mobile pause button */
  #pause-btn {
    position: fixed; top: 16px; right: 16px;
    z-index: 10; background: none; border: none;
    color: #444; font-size: 1.4rem; cursor: pointer;
    padding: 8px; line-height: 1;
  }

  /* Mobile lane touch zones */
  #touch-zones {
    position: fixed; bottom: 0; left: 0; right: 0;
    height: 160px; display: none; z-index: 5;
  }
  .touch-zone {
    flex: 1; border: none; background: transparent;
    position: relative; overflow: hidden;
  }
  .touch-zone::after {
    content: ''; position: absolute; inset: 0;
    background: rgba(255,255,255,0.04);
    border-left: 1px solid #1a1a1a;
    pointer-events: none;
  }
  .touch-zone:first-child::after { border-left: none; }
  .touch-zone:active { background: rgba(255,255,255,0.08); }

  /* Mobile: show touch zones */
  @media (hover: none) and (pointer: coarse) {
    #touch-zones { display: flex; }
    #pause-btn { display: block; }
  }
  @media (hover: hover) and (pointer: fine) {
    #pause-btn { display: none; }
  }

  /* Responsive start screen */
  @media (max-width: 480px) {
    #start-screen h1 { font-size: 1.4rem; margin-bottom: 1.5rem; }
    #drop-zone { width: 260px; height: 150px; }
  }
</style>
</head>
<body>

<div id="start-screen">
  <h1>MUSIC BLOCKS</h1>
  <div id="drop-zone">
    <svg viewBox="0 0 24 24"><path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55C7.79 13 6 14.79 6 17s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/></svg>
    <span>拖放 MP3 或点击选择</span>
    <input type="file" id="file-input" accept="audio/*">
  </div>
  <div id="file-name"></div>
</div>

<div id="game">
  <canvas id="canvas"></canvas>
  <div id="score">0</div>
  <div id="combo"></div>
  <div id="progress-bar"></div>
  <button id="pause-btn" onclick="game.togglePause()">II</button>
  <div id="touch-zones">
    <div class="touch-zone" data-lane="0"></div>
    <div class="touch-zone" data-lane="1"></div>
    <div class="touch-zone" data-lane="2"></div>
    <div class="touch-zone" data-lane="3"></div>
  </div>
</div>

<div id="pause-overlay">
  <p>PAUSED</p>
  <button onclick="game.resume()">继续</button>
  <button onclick="game.restart()">重新开始</button>
</div>

<script>
const $ = id => document.getElementById(id);

// Audio analysis
async function analyzeAudio(buffer) {
  const ctx = new OfflineAudioContext(1, buffer.length, buffer.sampleRate);
  const src = ctx.createBufferSource();
  src.buffer = buffer;
  src.connect(ctx.destination);
  src.start();

  const rendered = await ctx.startRendering();
  const data = rendered.getChannelData(0);

  // Detect peaks (beats)
  const sampleRate = buffer.sampleRate;
  const windowSize = Math.floor(sampleRate * 0.05); // 50ms windows
  const hopSize = Math.floor(windowSize / 2);
  const energies = [];

  for (let i = 0; i < data.length - windowSize; i += hopSize) {
    let energy = 0;
    for (let j = 0; j < windowSize; j++) {
      energy += data[i + j] * data[i + j];
    }
    energies.push(energy / windowSize);
  }

  // Find peaks above adaptive threshold
  const peaks = [];
  const lookAhead = 10;
  const threshold = 0.6;

  for (let i = lookAhead; i < energies.length - lookAhead; i++) {
    let localMax = 0;
    for (let j = i - lookAhead; j <= i + lookAhead; j++) {
      if (energies[j] > localMax) localMax = energies[j];
    }
    if (energies[i] === localMax && energies[i] > 0) {
      // Check against average energy
      let avg = 0;
      for (let j = i - lookAhead * 2; j <= i + lookAhead * 2; j++) {
        if (j >= 0 && j < energies.length) avg += energies[j];
      }
      avg /= lookAhead * 4 + 1;
      if (energies[i] > avg * (1 + threshold)) {
        const time = (i * hopSize) / sampleRate;
        if (peaks.length === 0 || time - peaks[peaks.length - 1] > 0.12) {
          peaks.push(time);
        }
      }
    }
  }

  return peaks;
}

// Game
const game = {
  canvas: null, ctx: null,
  blocks: [], particles: [],
  score: 0, combo: 0, maxCombo: 0,
  audioCtx: null, source: null, buffer: null,
  startTime: 0, playing: false, paused: false,
  fallDuration: 2.5,
  lanes: 4,
  hitLineY: 0,
  animId: null,

  init(audioBuffer) {
    this.canvas = $('canvas');
    this.ctx = this.canvas.getContext('2d');
    this.buffer = audioBuffer;
    this.score = 0; this.combo = 0; this.maxCombo = 0;
    this.blocks = []; this.particles = [];
    this.paused = false;

    this.resize();
    window.addEventListener('resize', () => this.resize());

    $('start-screen').style.display = 'none';
    $('game').style.display = 'block';
    $('score').textContent = '0';
    $('combo').textContent = '';

    this.generateBlocks();
    this.start();
  },

  resize() {
    const dpr = window.devicePixelRatio || 1;
    this.w = window.innerWidth;
    this.h = window.innerHeight;
    this.canvas.width = this.w * dpr;
    this.canvas.height = this.h * dpr;
    this.ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    this.isMobile = matchMedia('(hover: none) and (pointer: coarse)').matches;
    this.hitLineY = this.isMobile ? this.h - 140 : this.h - 100;
    this.laneWidth = this.w / this.lanes;
  },

  async generateBlocks() {
    const peaks = await analyzeAudio(this.buffer);
    this.blocks = peaks.map((time, i) => ({
      time,
      lane: i % this.lanes,
      y: 0, hit: false, missed: false,
      opacity: 1,
      size: 0.7 + Math.random() * 0.3,
    }));
  },

  start() {
    this.audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    this.source = this.audioCtx.createBufferSource();
    this.source.buffer = this.buffer;
    this.source.connect(this.audioCtx.destination);
    this.source.onended = () => this.end();
    this.startTime = this.audioCtx.currentTime + this.fallDuration;
    this.source.start(this.startTime);
    this.playing = true;

    this.canvas.addEventListener('pointerdown', e => this.hit(e));
    document.addEventListener('keydown', e => {
      if (e.code === 'Space') { e.preventDefault(); this.hit(null); }
      if (e.code === 'Escape') this.togglePause();
    });

    // Mobile touch zones
    document.querySelectorAll('.touch-zone').forEach(zone => {
      zone.addEventListener('pointerdown', e => {
        e.preventDefault();
        const lane = parseInt(zone.dataset.lane);
        this.hitAt(lane, e.clientX, e.clientY);
      });
    });

    this.loop();
  },

  loop() {
    if (this.paused) return;
    const ctx = this.ctx;
    const now = this.audioCtx.currentTime - this.startTime;

    ctx.clearRect(0, 0, this.w, this.h);

    // Draw lanes (subtle)
    ctx.strokeStyle = '#1a1a1a';
    ctx.lineWidth = 1;
    for (let i = 1; i < this.lanes; i++) {
      ctx.beginPath();
      ctx.moveTo(i * this.laneWidth, 0);
      ctx.lineTo(i * this.laneWidth, this.h);
      ctx.stroke();
    }

    // Hit line
    ctx.strokeStyle = '#333';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(0, this.hitLineY);
    ctx.lineTo(this.w, this.hitLineY);
    ctx.stroke();

    // Lane key hints
    ctx.fillStyle = '#222';
    ctx.font = '200 14px sans-serif';
    ctx.textAlign = 'center';
    const hints = this.isMobile ? ['1', '2', '3', '4'] : ['D', 'F', 'J', 'K'];
    for (let i = 0; i < this.lanes; i++) {
      ctx.fillText(hints[i], i * this.laneWidth + this.laneWidth / 2, this.hitLineY + 30);
    }

    // Update & draw blocks
    let activeBlocks = 0;
    for (const block of this.blocks) {
      const elapsed = block.time - now;
      block.y = this.hitLineY - (elapsed / this.fallDuration) * this.hitLineY;

      if (block.hit) {
        block.opacity -= 0.15;
        if (block.opacity <= 0) continue;
      }

      if (!block.hit && !block.missed && block.y > this.hitLineY + 40) {
        block.missed = true;
        this.combo = 0;
        $('combo').textContent = '';
      }

      if (block.y < -50 || block.y > this.h + 50) {
        if (block.missed || block.hit) continue;
      }

      activeBlocks++;
      const x = block.lane * this.laneWidth + this.laneWidth * 0.15;
      const bw = this.laneWidth * 0.7;
      const bh = 24 * block.size;

      ctx.globalAlpha = block.hit ? block.opacity : (block.missed ? 0.15 : 0.85);

      // Block
      const gradient = ctx.createLinearGradient(x, block.y - bh/2, x, block.y + bh/2);
      gradient.addColorStop(0, block.hit ? '#fff' : '#e0e0e0');
      gradient.addColorStop(1, block.hit ? '#aaa' : '#888');
      ctx.fillStyle = gradient;

      const r = 6;
      ctx.beginPath();
      ctx.moveTo(x + r, block.y - bh/2);
      ctx.lineTo(x + bw - r, block.y - bh/2);
      ctx.quadraticCurveTo(x + bw, block.y - bh/2, x + bw, block.y - bh/2 + r);
      ctx.lineTo(x + bw, block.y + bh/2 - r);
      ctx.quadraticCurveTo(x + bw, block.y + bh/2, x + bw - r, block.y + bh/2);
      ctx.lineTo(x + r, block.y + bh/2);
      ctx.quadraticCurveTo(x, block.y + bh/2, x, block.y + bh/2 - r);
      ctx.lineTo(x, block.y - bh/2 + r);
      ctx.quadraticCurveTo(x, block.y - bh/2, x + r, block.y - bh/2);
      ctx.fill();

      ctx.globalAlpha = 1;
    }

    // Particles
    for (let i = this.particles.length - 1; i >= 0; i--) {
      const p = this.particles[i];
      p.x += p.vx; p.y += p.vy; p.vy += 0.15;
      p.life -= 0.03;
      if (p.life <= 0) { this.particles.splice(i, 1); continue; }
      ctx.globalAlpha = p.life;
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;

    // Progress
    const progress = Math.max(0, Math.min(1, now / this.buffer.duration));
    $('progress-bar').style.width = (progress * 100) + '%';

    if (activeBlocks > 0 || progress < 1) {
      this.animId = requestAnimationFrame(() => this.loop());
    }
  },

  hit(e) {
    if (this.paused) return;
    if (!e) { this.hitAll(); return; }
    const lane = Math.floor(e.clientX / this.laneWidth);
    this.hitAt(lane, e.clientX, e.clientY);
  },

  hitAll() {
    const now = this.audioCtx.currentTime - this.startTime;
    const hitWindow = 0.12;
    for (const block of this.blocks) {
      if (block.hit || block.missed) continue;
      const dist = Math.abs(block.time - now);
      if (dist < hitWindow) {
        this.registerHit(block, dist);
        break;
      }
    }
  },

  hitAt(lane, x, y) {
    if (this.paused) return;
    const now = this.audioCtx.currentTime - this.startTime;
    const hitWindow = 0.12;

    let bestBlock = null;
    let bestDist = Infinity;

    for (const block of this.blocks) {
      if (block.hit || block.missed) continue;
      if (block.lane !== lane) continue;
      const dist = Math.abs(block.time - now);
      if (dist < hitWindow && dist < bestDist) {
        bestDist = dist;
        bestBlock = block;
      }
    }

    if (bestBlock) {
      this.registerHit(bestBlock, bestDist);
      this.spawnParticles(bestBlock);
    } else {
      this.combo = 0;
      $('combo').textContent = '';
    }
  },

  registerHit(block, dist) {
    block.hit = true;
    this.combo++;
    if (this.combo > this.maxCombo) this.maxCombo = this.combo;

    const points = dist < 0.04 ? 3 : dist < 0.08 ? 2 : 1;
    this.score += points * (1 + Math.floor(this.combo / 10));

    $('score').textContent = this.score;
    $('combo').textContent = this.combo > 1 ? `${this.combo} COMBO` : '';

    const label = dist < 0.04 ? 'PERFECT' : dist < 0.08 ? 'GREAT' : 'GOOD';
    const color = dist < 0.04 ? '#fff' : dist < 0.08 ? '#ccc' : '#888';
    this.showHitEffect(block, label, color);
  },

  showHitEffect(block, text, color) {
    const el = document.createElement('div');
    el.className = 'hit-effect';
    el.textContent = text;
    el.style.color = color;
    el.style.left = (block.lane * this.laneWidth + this.laneWidth / 2) + 'px';
    el.style.top = this.hitLineY - 30 + 'px';
    el.style.transform = 'translateX(-50%)';
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 600);
  },

  spawnParticles(block) {
    const cx = block.lane * this.laneWidth + this.laneWidth / 2;
    const cy = this.hitLineY;
    for (let i = 0; i < 8; i++) {
      const angle = (Math.PI * 2 * i) / 8 + Math.random() * 0.3;
      this.particles.push({
        x: cx, y: cy,
        vx: Math.cos(angle) * (2 + Math.random() * 3),
        vy: Math.sin(angle) * (2 + Math.random() * 3) - 2,
        size: 2 + Math.random() * 3,
        life: 1,
        color: `hsl(${Math.random() * 60 + 200}, 70%, 70%)`,
      });
    }
  },

  togglePause() {
    if (this.paused) this.resume();
    else this.pause();
  },

  pause() {
    this.paused = true;
    this.audioCtx.suspend();
    $('pause-overlay').classList.add('show');
  },

  resume() {
    this.paused = false;
    this.audioCtx.resume();
    $('pause-overlay').classList.remove('show');
    this.loop();
  },

  restart() {
    this.paused = false;
    $('pause-overlay').classList.remove('show');
    if (this.source) { try { this.source.stop(); } catch(e) {} }
    if (this.animId) cancelAnimationFrame(this.animId);
    this.init(this.buffer);
  },

  end() {
    setTimeout(() => {
      alert(`演奏结束!\n得分: ${this.score}\n最高连击: ${this.maxCombo}`);
      location.reload();
    }, 500);
  },
};

// File loading
const dropZone = $('drop-zone');
const fileInput = $('file-input');

dropZone.addEventListener('click', () => fileInput.click());
dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('dragover'); });
dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
dropZone.addEventListener('drop', e => {
  e.preventDefault();
  dropZone.classList.remove('dragover');
  if (e.dataTransfer.files[0]) loadFile(e.dataTransfer.files[0]);
});
fileInput.addEventListener('change', e => {
  if (e.target.files[0]) loadFile(e.target.files[0]);
});

async function loadFile(file) {
  $('file-name').textContent = `加载中: ${file.name}...`;
  try {
    const arrayBuffer = await file.arrayBuffer();
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const audioBuffer = await audioCtx.decodeAudioData(arrayBuffer);
    $('file-name').textContent = file.name;
    audioCtx.close();
    game.init(audioBuffer);
  } catch (err) {
    $('file-name').textContent = '无法解析该音频文件';
    console.error(err);
  }
}
</script>
</body>
</html>
